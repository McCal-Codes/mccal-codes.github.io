name: Deploy

# Builds and publishes to GitHub Pages.
#
# Pages has no rewrites and no response headers, so the build pre-renders one
# HTML file per route and injects the CSP as a meta tag.
# See scripts/emit-route-pages.js.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Independent of the build script, so a pre-render regression fails here
      # rather than publishing 404s at indexed URLs.
      - name: Verify dist
        run: npm run verify:dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
