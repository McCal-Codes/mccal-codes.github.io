<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>McCal Development has moved to mccal.dev</title>
    <link rel="canonical" href="https://mccal.dev/" />
    <meta http-equiv="refresh" content="0; url=https://mccal.dev/" />
    <meta name="theme-color" content="#0b0b10" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b10;
        --text: #f4f3f8;
        --dim: #8f8ca6;
        --accent: #cfc8f5;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.6 'Plus Jakarta Sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--dim);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>McCal Development is at mccal.dev</h1>
      <p>Taking you there now.</p>
      <p><a href="https://mccal.dev/">mccal.dev</a></p>
    </main>
  </body>
</html>
